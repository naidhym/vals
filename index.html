<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valentine 💙💗</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<audio id="bgMusic" src="music/love.mp3" loop></audio>

<section class="page active" id="page1">
  <h1>Would u be my Valentine? 💙💗</h1>
  <div class="buttons">
    <button id="yesBtn">YES 💖</button>
    <button id="noBtn">NO 😜</button>
  </div>
</section>

<section class="page" id="page2">
  <h2>YAYYYY 🥰</h2>
  <img src="images/foto1.jpg" class="photo">
  <p>Thank you for choosing me 💙</p>
  <button class="nextBtn">Next ➜</button>
</section>

<section class="page" id="page3">
  <h2>For You 💌</h2>
  <img src="images/foto2.jpg" class="photo">
  <p class="letter">
    Being with you makes my world brighter.  
    You are my favorite person.
  </p>
  <button class="nextBtn">Next ➜</button>
</section>

<section class="page" id="page4">
  <h2>I Love You 💘</h2>
  <img src="images/foto3.jpg" class="photo">

  <p class="letter">
    I want you to be my Valentine —  
    today, tomorrow, and always.
  </p>

  <div class="coupon">
    <img src="images/coupon.jpg" class="coupon-img">
    <p>🎁 Show this coupon to claim your gift 💝</p>
  </div>
</section>

<script src="script.js"></script>
</body>
</html>
